button,input,select,textarea{font:inherit}

.topbar{

.logo{font-weight:800;font-size:19px}

.container{

}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.tile{
    background:white;
    padding:22px;
    border-radius:16px;
    border:1px solid #e6eaf0;
    cursor:pointer;
    transition:.2s;
}
.tile:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0,0,0,.08);
}
.icon{
    font-size:34px;
    margin-bottom:10px;
}

.form{

    gap:11px;
}

.input{

.btn{

.btn.gray{

.btn.red{background:#dc2626}
.btn.green{background:#059669}

.login-page{

.login-box{

}
.role-grid{

    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:18px 0;
}
.role{
    padding:16px;
    border:2px solid transparent;
    border-radius:12px;
    background:#eef2ff;
    text-align:center;
    cursor:pointer;
}
.role.active{
    border-color:#2563eb;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #edf0f4;
}
.item:last-child{border-bottom:0}

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-bottom:18px;
}
.tab{
    padding:9px 13px;
    background:#e5e7eb;
    border-radius:9px;
    white-space:nowrap;
}
.tab.active{
    background:#2563eb;
    color:white;
}

.badge{

    padding:4px 9px;
    background:#eef2ff;
    color:#3730a3;
    border-radius:999px;

.notice{

.viewer-frame{

/* =====================================================
   HELPERS
===================================================== */

function id(prefix){

    return prefix +
        Date.now() +
        Math.random()
        .toString(36)
        .slice(2,7);
}

function esc(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =====================================================
   PDF VIEWER
===================================================== */

function openPdf(id){

    const pdf =
        db.pdfs.find(p=>p.id===id);

    if(!pdf)return;

    currentPdf = pdf;

    document.getElementById("app")
        .insertAdjacentHTML(
            "beforeend",
            `
            <div class="viewer">

                <div class="viewer-box">

                    <div class="viewer-head">

                        <b>
                            ${esc(pdf.title)}
                        </b>

                        <button
                            class="btn gray"
                            onclick="closePdf()">

                            Close

                        </button>

                    </div>

                    <iframe
                        class="viewer-frame"
                        src="${pdf.data}">
                    </iframe>

                </div>

            </div>
            `
        );
}

function closePdf(){

    const v =
        document.querySelector(".viewer");

    if(v)v.remove();

    currentPdf = null;
}

/* =====================================================

===================================================== */

function adminPdfs(){

    return `

        <div class="card">

            <h2>
                📄 Manual PDF Upload
            </h2>

            <p class="muted">
                Class → Semester → Subject → Chapter
                चुनकर PDF upload करें।
            </p>

            <div class="form">

                <select
                    id="pdfClass"
                    class="input"
                    onchange="updatePdfSemester()">

                    <option value="">
                        -- Class चुनें --
                    </option>

                            <option value="${c.id}">
                                ${esc(c.name)}
                            </option>

                        `).join("")
                    }

                </select>


                <select
                    id="pdfSemester"
                    class="input"
                    onchange="updatePdfSubject()">

                    <option value="">
                        -- Semester चुनें --
                    </option>

                </select>


                <select
                    id="pdfSubject"
                    class="input"
                    onchange="updatePdfChapter()">

                    <option value="">
                        -- Subject चुनें --
                    </option>

                </select>


                <select
                    id="pdfChapter"
                    class="input">

                    <option value="">
                        -- Chapter चुनें --
                    </option>

                </select>


                <input
                    id="pdfTitle"
                    class="input"
                    placeholder="PDF Title">


                <textarea
                    id="pdfDescription"
                    class="input"
                    placeholder="PDF Description"
                    rows="3"></textarea>


                <input
                    id="pdfFile"
                    class="input"
                    type="file"
                    accept="application/pdf">


                <button
                    class="btn green"
                    onclick="uploadPdf()">

                    ⬆ Upload PDF

                </button>

            </div>

        </div>


        <div class="card">

            <h2>
                Uploaded PDFs
            </h2>

            ${
                db.pdfs.map(p=>`

                    <div class="item">

                        <div>

                            <b>
                                📄 ${esc(p.title)}
                            </b>

                            <div class="small muted">

                                ${
                                    esc(
                                        db.chapters
                                        .find(
                                            c=>c.id===p.chapterId
                                        )?.name || ""
                                    )
                                }

                            </div>

                        </div>


                        <button
                            class="btn red"
                            onclick="deletePdf('${p.id}')">

                            Delete

                        </button>

                    </div>

                `).join("")
                ||
                `<p class="muted">
                    अभी कोई PDF upload नहीं हुई है।
                </p>`
            }

        </div>

    `;

}

function updatePdfSemester(){

    const classId =
        document.getElementById("pdfClass")
        .value;

    const semester =
        document.getElementById("pdfSemester");

    const subject =
        document.getElementById("pdfSubject");

    const chapter =
        document.getElementById("pdfChapter");


    semester.innerHTML =
        `<option value="">-- Semester चुनें --</option>`;

    subject.innerHTML =
        `<option value="">-- Subject चुनें --</option>`;

    chapter.innerHTML =
        `<option value="">-- Chapter चुनें --</option>`;


    if(!classId)return;


    db.semesters
        .filter(
            s=>s.classId===classId
        )
        .forEach(s=>{

            semester.innerHTML += `
                <option value="${s.id}">
                    ${esc(s.name)}
                </option>
            `;

        });

}

function updatePdfSubject(){

    const classId =
        document.getElementById("pdfClass")
        .value;

    const semesterId =
        document.getElementById("pdfSemester")
        .value;

    const subject =
        document.getElementById("pdfSubject");

    const chapter =
        document.getElementById("pdfChapter");


    subject.innerHTML =
        `<option value="">-- Subject चुनें --</option>`;

    chapter.innerHTML =
        `<option value="">-- Chapter चुनें --</option>`;


    if(!classId || !semesterId)return;


    db.subjects
        .filter(
            s=>
                s.classId===classId &&
                s.semesterId===semesterId
        )
        .forEach(s=>{

            subject.innerHTML += `
                <option value="${s.id}">
                    ${esc(s.name)}
                </option>
            `;

        });

}

function updatePdfChapter(){

    const subjectId =
        document.getElementById("pdfSubject")
        .value;

    const chapter =
        document.getElementById("pdfChapter");


    chapter.innerHTML =
        `<option value="">-- Chapter चुनें --</option>`;


    if(!subjectId)return;


    db.chapters
        .filter(
            c=>c.subjectId===subjectId
        )
        .forEach(c=>{

            chapter.innerHTML += `
                <option value="${c.id}">
                    ${esc(c.name)}
                </option>
            `;

        });

}

function uploadPdf(){

    const file =
        document.getElementById("pdfFile")
        .files[0];

    const title =
        document.getElementById("pdfTitle")
        .value.trim()
        ||
        file?.name
        ||
        "";

    const description =
        document.getElementById("pdfDescription")
        .value.trim();

    const chapterId =
        document.getElementById("pdfChapter")
        .value;


    if(!file){

        alert("PDF file चुनें।");

        return;

    }


    if(file.type !== "application/pdf"){

        alert("सिर्फ PDF file upload करें।");

        return;

    }


    if(!chapterId){

        alert("Chapter चुनें।");

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function(){

        db.pdfs.push({

            id:id("pdf"),

            title:title,

            description:description,

            chapterId:chapterId,

            data:reader.result

        });


        saveDB();

        alert(
            "PDF upload हो गई।"
        );

        adminDashboard();

    };


    reader.readAsDataURL(file);

}

function deletePdf(idValue){

    if(!confirm("PDF delete करें?"))
        return;

    db.pdfs =
        db.pdfs.filter(
            p=>p.id!==idValue
        );

    saveDB();

    adminDashboard();

}
