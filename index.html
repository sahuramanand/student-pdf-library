<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student PDF Library</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e3a8a;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 10px;
            font-size: 14px;
            color: #1e3a8a;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="login-box">

        <h1>📚 Student PDF Library</h1>

        <div class="subtitle">
            Student Study Material Portal
        </div>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <div class="demo">
            <b>Demo Student Login</b><br>
            Email: student@example.com<br>
            Password: student123
        </div>

    </div>

</div>

<script>
function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (
        email === "student@example.com" &&
        password === "student123"
    ) {

        showMedium();

    } else {

        alert("Email या Password गलत है।");

    }
}


function showMedium() {

    document.getElementById("app").innerHTML = `

        <div class="page">

            <div class="login-box">

                <h1>
                    🌐 Medium चुनें
                </h1>

                <p class="subtitle">
                    अपना अध्ययन माध्यम चुनें
                </p>

                <button
                    onclick="selectMedium('Hindi')">

                    🇮🇳 हिंदी माध्यम

                </button>

                <br><br>

                <button
                    onclick="selectMedium('English')">

                    🇬🇧 English Medium

                </button>

                <br><br>

                <button
                    onclick="showLogin()"
                    style="background:#dc2626">

                    Logout

                </button>

            </div>

        </div>

    `;
}


function showLogin() {

    location.reload();

}


function selectMedium(medium) {

    alert(
        "आपने " + medium + " Medium चुना है।"
    );

}
