<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student PDF Library</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f3f6fb;
    color:#172033;
}

/* ================= LOGIN PAGE ================= */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#eaf2ff,#f4efff);
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 12px 35px rgba(0,0,0,0.10);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:28px;
    font-size:16px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #d1d5db;
    border-radius:11px;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:#2563eb;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.btn:hover{
    background:#1d4ed8;
}

.demo{
    margin-top:20px;
    padding:14px;
    border-radius:11px;
    background:#eff6ff;
    color:#1e3a8a;
    font-size:14px;
    line-height:1.6;
}


/* ================= MAIN PAGE ================= */

.main-page{
    min-height:100vh;
    padding:25px 15px;
}

.header{
    max-width:1000px;
    margin:0 auto 30px;
    padding:30px;
    border-radius:20px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
}

.header h1{
    margin-bottom:8px;
    font-size:30px;
}

.header p{
    font-size:16px;
}

.medium-container{
    max-width:900px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

    gap:20px;
}

.medium-card{
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;

    box-shadow:0 8px 25px rgba(0,0,0,0.08);

    cursor:pointer;

    transition:0.2s;
}

.medium-card:hover{
    transform:translateY(-5px);
}

.medium-icon{
    font-size:50px;
    margin-bottom:15px;
}

.medium-card h2{
    margin-bottom:10px;
    color:#172033;
}

.medium-card p{
    color:#6b7280;
}

.logout{
    width:auto;
    margin-top:18px;
    padding:10px 18px;
    background:#dc2626;
    font-size:14px;
}

.logout:hover{
    background:#b91c1c;
}


/* ================= MESSAGE ================= */

.message-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.message-box{
    width:100%;
    max-width:500px;
    background:white;
    padding:35px;
    text-align:center;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.message-box h2{
    margin-bottom:12px;
    color:#1e3a8a;
}

.message-box p{
    color:#6b7280;
    margin-bottom:20px;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .login-box{
        padding:25px;
    }

    .logo{
        font-size:25px;
    }

    .header{
        padding:25px 18px;
    }

    .header h1{
        font-size:25px;
    }

}

</style>
</head>


<body>

<div id="app"></div>


<script>

/* ==========================================
   LOGIN PAGE
========================================== */
    
function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (
        email === "admin@example.com" &&
        password === "admin123"
    ) {

        showAdmin();

    }
    else if (
        email === "student@example.com" &&
        password === "student123"
    ) {

        showMedium();

    }
    else {

        alert("Email या Password गलत है।");

    }

}

========================================== */

function selectChapter(chapter) {

function showPDFs(chapter) {
