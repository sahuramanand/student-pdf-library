<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student PDF Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    background:#172554;
    color:white;
    padding:15px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.07);
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:16px;
}

.tile{
    background:white;
    padding:25px;

    border-radius:16px;
    border:1px solid #e5e7eb;

    cursor:pointer;
    transition:.2s;
}

.tile:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.hero{
    background:
        linear-gradient(135deg,#2563eb,#7c3aed);

    color:white;

    padding:28px;

    border-radius:20px;

    margin-bottom:20px;
}

.form{
    display:grid;
    gap:12px;
}

.input{
    width:100%;
    padding:12px;

    border:1px solid #d1d5db;
    border-radius:10px;
}

.btn{
    padding:11px 15px;

    border:none;

    border-radius:10px;

    background:#2563eb;
    color:white;
}

.gray{
    background:#e5e7eb;
    color:#111827;
}

.red{
    background:#dc2626;
}

.green{
    background:#059669;
}

.login-page{
    min-height:100vh;

    display:grid;
    place-items:center;

    padding:20px;

    background:
        linear-gradient(135deg,#edf4ff,#f5f0ff);
}

.login-box{
    width:min(430px,100%);
}

.role-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
}

.role{
    padding:20px;

    border-radius:14px;

    background:#eef2ff;

    text-align:center;

    cursor:pointer;

    border:2px solid transparent;
}

.role.active{
    border-color:#2563eb;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;

    padding:14px 0;

    border-bottom:
        1px solid #edf0f4;
}

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;

    margin-bottom:18px;
}

.tab{
    padding:10px 13px;

    border:0;
    border-radius:9px;

    background:#e5e7eb;

    white-space:nowrap;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.viewer{
    position:fixed;

    inset:0;

    background:#000b;

    z-index:100;

    padding:12px;
}

.viewer-box{
    background:white;

    height:92vh;

    width:min(1100px,100%);

    margin:auto;

    border-radius:15px;

    overflow:hidden;

    display:flex;

    flex-direction:column;
}

.viewer-head{
    padding:12px 15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:1px solid #ddd;
}

.viewer-frame{
    flex:1;

    width:100%;

    border:0;
}

@media(max-width:600px){

    .topbar{
        padding:12px;
    }

    .role-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div id="app"></div>


<script>

/* ====================================================
   SUPABASE CONFIG
==================================================== */

const SUPABASE_URL =
"https://ztwpwqrsrdizkabymcwc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kyRdkZMtp811EsVnjk0SPA__CZICCPo";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ====================================================
   STATE
==================================================== */

let currentUser = null;

let currentProfile = null;

let selectedMedium = null;

let selectedClass = null;

let selectedSemester = null;

let selectedSubject = null;

let selectedChapter = null;

let pdfWindow = null;

let loginRole = "student";

let adminTab = "classes";


/* ====================================================
   HELPERS
==================================================== */

function esc(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

async function app(){

    const html = await render();

    document.getElementById("app").innerHTML = html;

}


/* ====================================================
   LOGIN
==================================================== */
async function render(){

    if(!currentUser){

        return loginPage();

    }

    if(currentProfile && currentProfile.role === "admin"){

        return topbar() + await adminPage();

    }

    return topbar() + await studentPage();

}
async function app(){

    const html = await render();

    document.getElementById("app").innerHTML = html;

}

function loginPage(){

    return `

        <div class="login-page">

            <div class="card login-box">

                <h1 style="text-align:center;color:#1e3a8a">
                    📚 Student PDF Library
                </h1>

                <p style="text-align:center;color:#6b7280">
                    Online Study Material Portal
                </p>


                <div class="role-grid">

                    <div
                        class="role ${loginRole==="student"?"active":""}"
                        onclick="loginRole='student';app()">

                        🎓

                        <br>

                        <b>Student Login</b>

                    </div>


                    <div
                        class="role ${loginRole==="admin"?"active":""}"
                        onclick="loginRole='admin';app()">

                        👨‍💻

                        <br>

                        <b>Admin Login</b>

                    </div>

                </div>


                <div class="form">

                    <input
                        id="loginEmail"
                        class="input"
                        type="email"
                        placeholder="Email">


                    <input
                        id="loginPassword"
                        class="input"
                        type="password"
                        placeholder="Password">


                    <button
                        class="btn"
                        onclick="doLogin()">

                        ${loginRole==="admin"
                            ?"Admin Login"
                            :"Student Login"}

                    </button>

                </div>


                <div class="card"
                     style="margin-top:15px;background:#eff6ff">

                    ${
                        loginRole==="admin"

                        ?

                        `<small>
                            Admin account Supabase Authentication में
                            बनाना होगा।
                         </small>`

                        :

                        `<small>
                            Student account से study material access करें।
                         </small>`

                    }

                </div>

            </div>

        </div>

    `;

}


async function doLogin(){

    const email =
        document.getElementById("loginEmail")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    if(!email || !password){

        alert("Email और Password भरें।");

        return;

    }


    const {data,error} =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        alert(error.message);

        return;

    }


    currentUser = data.user;


    await loadProfile();


    if(
        loginRole==="admin"
        &&
        currentProfile?.role!=="admin"
    ){

        await supabaseClient.auth.signOut();

        currentUser=null;

        currentProfile=null;

        alert("यह account Admin नहीं है।");

        app();

        return;

    }


    app();

}


/* ====================================================
   PROFILE
==================================================== */

async function loadProfile(){

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .single();


    if(!error){

        currentProfile=data;

    }

}


/* ====================================================
   LOGOUT
==================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser=null;

    currentProfile=null;

    selectedMedium=null;

    selectedClass=null;

    selectedSemester=null;

    selectedSubject=null;

    selectedChapter=null;

    app();

}


/* ====================================================
   TOPBAR
==================================================== */

function topbar(){

    return `

        <div class="topbar">

            <b>
                📚 Student PDF Library
            </b>

            <button
                class="btn gray"
                onclick="logout()">

                Logout

            </button>

        </div>

    `;

}


/* ====================================================
   STUDENT
==================================================== */

function studentPage(){

    if(!selectedMedium){

        return mediumPage();

    }

    if(!selectedClass){

        return classPage();

    }

    if(!selectedSemester){

        return semesterPage();

    }

    if(!selectedSubject){

        return subjectPage();

    }

    if(!selectedChapter){

        return chapterPage();

    }

    return materialPage();

}


/* ====================================================
   MEDIUM
==================================================== */

async function mediumPage(){

    const result =
        await supabaseClient
        .from("media")
        .select("*")
        .order("id");

    const list=result.data || [];

    return selectionPage(
        "🌐 Medium चुनें",
        list,
        "chooseMedium",
        "🌐"
    );

}


function selectionPage(title,list,fn,icon){

    return `

        <main class="container">

            <div class="hero">

                <h1>
                    ${title}
                </h1>

                <p>
                    आगे बढ़ने के लिए option चुनें।
                </p>

            </div>


            <div class="grid">

                ${
                    list.length

                    ?

                    list.map(x=>`

                        <div
                            class="tile"
                            onclick="${fn}('${x.id}')">

                            <div style="font-size:35px">
                                ${icon}
                            </div>

                            <h3>
                                ${esc(x.name)}
                            </h3>

                            <p class="muted">
                                Open →
                            </p>

                        </div>

                    `).join("")

                    :

                    `
                        <div class="card">
                            अभी कोई option उपलब्ध नहीं है।
                        </div>
                    `

                }

            </div>

        </main>

    `;

}


async function chooseMedium(id){

    const {data} =
        await supabaseClient
        .from("media")
        .select("*")
        .eq("id",id)
        .single();

    selectedMedium=data;

    app();

}


/* ====================================================
   CLASS
==================================================== */

async function classPage(){

    const {data} =
        await supabaseClient
        .from("classes")
        .select("*")
        .order("id");

    return selectionPage(
        "🎓 Class / Course चुनें",
        data || [],
        "chooseClass",
        "🎓"
    );

}


async function chooseClass(id){

    const {data} =
        await supabaseClient
        .from("classes")
        .select("*")
        .eq("id",id)
        .single();

    selectedClass=data;

    app();

}


/* ====================================================
   SEMESTER
==================================================== */

async function semesterPage(){

    const {data} =
        await supabaseClient
        .from("semesters")
        .select("*")
        .eq("class_id",selectedClass.id)
        .order("id");

    return selectionPage(
        "📘 Semester चुनें",
        data || [],
        "chooseSemester",
        "📘"
    );

}


async function chooseSemester(id){

    const {data} =
        await supabaseClient
        .from("semesters")
        .select("*")
        .eq("id",id)
        .single();

    selectedSemester=data;

    app();

}


/* ====================================================
   SUBJECT
==================================================== */

async function subjectPage(){

    const {data} =
        await supabaseClient
        .from("subjects")
        .select("*")
        .eq("class_id",selectedClass.id)
        .eq("semester_id",selectedSemester.id)
        .or(
            `medium_id.is.null,medium_id.eq.${selectedMedium.id}`
        )
        .order("id");

    return selectionPage(
        "📚 Subject चुनें",
        data || [],
        "chooseSubject",
        "📚"
    );

}


async function chooseSubject(id){

    const {data} =
        await supabaseClient
        .from("subjects")
        .select("*")
        .eq("id",id)
        .single();

    selectedSubject=data;

    app();

}


/* ====================================================
   CHAPTER
==================================================== */

async function chapterPage(){

    const {data} =
        await supabaseClient
        .from("chapters")
        .select("*")
        .eq("subject_id",selectedSubject.id)
        .order("id");

    return selectionPage(
        "📖 Chapter चुनें",
        data || [],
        "chooseChapter",
        "📖"
    );

}


async function chooseChapter(id){

    const {data} =
        await supabaseClient
        .from("chapters")
        .select("*")
        .eq("id",id)
        .single();

    selectedChapter=data;

    app();

}


/* ====================================================
   MATERIALS
==================================================== */

async function materialPage(){

    const {data} =
        await supabaseClient
        .from("materials")
        .select("*")
        .eq("chapter_id",selectedChapter.id)
        .order("created_at");

    const list=data || [];

    return `

        <main class="container">

            <button
                class="btn gray"
                onclick="selectedChapter=null;app()">

                ← Back

            </button>


            <div class="hero"
                 style="margin-top:15px">

                <h1>
                    📄 PDF Study Material
                </h1>

                <p>
                    ${esc(selectedChapter.name)}
                </p>

            </div>


            ${
                list.length

                ?

                list.map(p=>`

                    <div class="card item">

                        <div>

                            <b>
                                📄 ${esc(p.title)}
                            </b>

                            <div class="small muted">

                                ${esc(
                                    p.description || ""
                                )}

                            </div>

                        </div>


                        <button
                            class="btn"
                            onclick="readPdf('${p.id}')">

                            Read PDF

                        </button>

                    </div>

                `).join("")

                :

                `
                    <div class="card">

                        <h3>
                            अभी PDF उपलब्ध नहीं है।
                        </h3>

                    </div>
                `
            }

        </main>

    `;

}


async function readPdf(id){

    const {data,error} =
        await supabaseClient
        .from("materials")
        .select("*")
        .eq("id",id)
        .single();

    if(error){

        alert(error.message);

        return;

    }


    const result =
        await supabaseClient
        .storage
        .from("study-pdfs")
        .createSignedUrl(
            data.storage_path,
            3600
        );


    if(result.error){

        alert(result.error.message);

        return;

    }


    pdfWindow={
        title:data.title,
        url:result.data.signedUrl
    };

    app();

}


/* ====================================================
   ADMIN
==================================================== */

function adminPage(){

    const tabs=[
        ["classes","Classes"],
        ["media","Medium"],
        ["semesters","Semesters"],
        ["subjects","Subjects"],
        ["chapters","Chapters"],
        ["pdfs","PDF Upload"]
    ];


    let body="";


    if(adminTab==="classes")
        body=adminClasses();

    if(adminTab==="media")
        body=adminMedia();

    if(adminTab==="semesters")
        body=adminSemesters();

    if(adminTab==="subjects")
        body=adminSubjects();

    if(adminTab==="chapters")
        body=adminChapters();

    if(adminTab==="pdfs")
        body=adminPdfs();


    return `

        <main class="container">

            <div class="hero">

                <h1>
                    👨‍💻 Admin Dashboard
                </h1>

                <p>
                    पूरा Study Portal manage करें।
                </p>

            </div>


            <div class="tabs">

                ${tabs.map(t=>`

                    <button
                        class="tab
                        ${adminTab===t[0]?"active":""}"
                        onclick="
                            adminTab='${t[0]}';
                            app()
                        ">

                        ${t[1]}

                    </button>

                `).join("")}

            </div>


            ${body}

        </main>

    `;

}


/* ====================================================
   ADMIN CLASSES
==================================================== */

async function adminClasses(){

    const {data} =
        await supabaseClient
        .from("classes")
        .select("*")
        .order("id");


    return adminListPage(
        "🎓 Classes",
        "newClass",
        "Class / Course name",
        "addClass",
        data || [],
        "editClass",
        "deleteClass"
    );

}


function adminListPage(
    title,
    inputId,
    placeholder,
    addFunction,
    list,
    editFunction,
    deleteFunction
){

    return `

        <div class="card">

            <h2>
                ${title}
            </h2>

            <div class="form">

                <input
                    id="${inputId}"
                    class="input"
                    placeholder="${placeholder}">

                <button
                    class="btn"
                    onclick="${addFunction}()">

                    + Add

                </button>

            </div>

        </div>


        <div class="card">

            <h2>
                List
            </h2>

            ${
                list.map(x=>`

                    <div class="item">

                        <b>
                            ${esc(x.name)}
                        </b>

                        <div>

                            <button
                                class="btn gray"
                                onclick="${editFunction}('${x.id}')">

                                Edit

                            </button>

                            <button
                                class="btn red"
                                onclick="${deleteFunction}('${x.id}')">

                                Delete

                            </button>

                        </div>

                    </div>

                `).join("")
            }

        </div>

    `;

}


async function addClass(){

    const name =
        document.getElementById("newClass")
        .value.trim();


    if(!name)return;


    const {error} =
        await supabaseClient
        .from("classes")
        .insert({name});


    if(error){

        alert(error.message);

        return;

    }


    app();

}


async function editClass(id){

    const old =
        await supabaseClient
        .from("classes")
        .select("name")
        .eq("id",id)
        .single();


    const name =
        prompt(
            "New class name:",
            old.data.name
        );


    if(!name)return;


    await supabaseClient
        .from("classes")
        .update({name})
        .eq("id",id);


    app();

}


async function deleteClass(id){

    if(!confirm("Class delete करें?"))
        return;


    await supabaseClient
        .from("classes")
        .delete()
        .eq("id",id);


    app();

}

/* ====================================================
   ADMIN SEMESTERS
==================================================== */

async function adminSemesters(){

    const {data:classes} =
        await supabaseClient
        .from("classes")
        .select("*")
        .order("id");


    const {data:semesters} =
        await supabaseClient
        .from("semesters")
        .select("*")
        .order("id");


    return `

        <div class="card">

            <h2>
                📘 Add Semester
            </h2>

            <div class="form">

                <select
                    id="semesterClass"
                    class="input">

                    ${
                        (classes||[])
                        .map(c=>`

                            <option value="${c.id}">
                                ${esc(c.name)}
                            </option>

                        `).join("")
                    }

                </select>


                <input
                    id="newSemester"
                    class="input"
                    placeholder="Semester name">


                <button
                    class="btn"
                    onclick="addSemester()">

                    + Add Semester

                </button>

            </div>

        </div>


        <div class="card">

            <h2>
                Semester List
            </h2>

            ${
                (semesters||[])
                .map(s=>`

                    <div class="item">

                        <div>

                            <b>
                                ${esc(s.name)}
                            </b>

                            <div class="small muted">

                                ${
                                    esc(
                                        classes
                                        ?.find(
                                            c=>c.id===s.class_id
                                        )
                                        ?.name || ""
                                    )
                                }

                            </div>

                        </div>


                        <div>

                            <button
                                class="btn gray"
                                onclick="editSemester('${s.id}')">

                                Edit

                            </button>


                            <button
                                class="btn red"
                                onclick="deleteSemester('${s.id}')">

                                Delete

                            </button>

                        </div>

                    </div>

                `).join("")
            }

        </div>

    `;

}


async function addSemester(){

    const name =
        document.getElementById("newSemester")
        .value.trim();


    const class_id =
        document.getElementById("semesterClass")
        .value;


    if(!name)return;


    await supabaseClient
        .from("semesters")
        .insert({
            name,
            class_id
        });


    app();

}


async function editSemester(id){

    const {data} =
        await supabaseClient
        .from("semesters")
        .select("name")
        .eq("id",id)
        .single();


    const name =
        prompt("New semester name:",data.name);


    if(!name)return;


    await supabaseClient
        .from("semesters")
        .update({name})
        .eq("id",id);


    app();

}


async function deleteSemester(id){

    if(!confirm("Semester delete करें?"))
        return;


    await supabaseClient
        .from("semesters")
        .delete()
        .eq("id",id);


    app();

}


/* ====================================================
   ADMIN SUBJECTS
==================================================== */

async function adminSubjects(){

    const {data:classes} =
        await supabaseClient
        .from("classes")
        .select("*")
        .order("id");


    const {data:semesters} =
        await supabaseClient
        .from("semesters")
        .select("*")
        .order("id");


    const {data:media} =
        await supabaseClient
        .from("media")
        .select("*")
        .order("id");


    const {data:subjects} =
        await supabaseClient
        .from("subjects")
        .select("*")
        .order("id");


    return `

        <div class="card">

            <h2>
                📚 Add Subject
            </h2>

            <div class="form">

                <select

    const list =

        .eq("class_id",classId.value)

                    }

                            </option>

                        `).join("")
                    }

                </select>

                    }

                    id="pdfDescription"
                    class="input"

                    id="pdfFile"
                    class="input"
                    type="file"
                    accept="application/pdf">


                <button
                    class="btn green"
                    onclick="uploadPdf()">

                    ⬆ Upload PDF

                </button>

            </div>

        </div>


        <div class="card">

            <h2>
                Uploaded PDFs
            </h2>

            ${
                (materials||[])
                .map(p=>`

                    <div class="item">

                        <div>

                            <b>
                                📄 ${esc(p.title)}
                            </b>

                            <div class="small muted">

                                ${esc(p.description || "")}

                            </div>

                        </div>

                        <button
                            class="btn red"
                            onclick="deletePdf('${p.id}')">

                            Delete

                        </button>

                    </div>

                `).join("")

async function uploadPdf(){

    const file =
        document.getElementById("pdfFile")
        .files[0];


    const title =
        document.getElementById("pdfTitle")
        .value.trim()
        ||
        file?.name
        ||
        "";


    const description =
        document.getElementById("pdfDescription")
        .value.trim();


    const chapterId =
        document.getElementById("pdfChapter")
        .value;


    if(!file){

        alert("PDF file चुनें।");

        return;

    }


    if(file.type !== "application/pdf"){

        alert("सिर्फ PDF upload करें।");

        return;

    }


    const safeName =
        file.name
        .replace(/[^a-zA-Z0-9._-]/g,"_");


    const path =
        currentUser.id
        +
        "/"
        +
        Date.now()
        +
        "-"
        +
        safeName;


    const upload =
        await supabaseClient
        .storage
        .from("study-pdfs")
        .upload(
            path,
            file,
            {
                contentType:"application/pdf",
                upsert:false
            }
        );


    if(upload.error){

        alert(upload.error.message);

        return;

    }


    const insert =
        await supabaseClient
        .from("materials")
        .insert({

            title:title,

            description:description,

            chapter_id:chapterId,

            storage_path:path

        });


    if(insert.error){

        await supabaseClient
            .storage
            .from("study-pdfs")
            .remove([path]);

        alert(insert.error.message);

        return;

    }


    alert("PDF successfully upload हो गई।");

    app();

}


async function deletePdf(id){

    if(!confirm("PDF delete करें?"))
        return;


    const {data,error} =
        await supabaseClient
        .from("materials")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        alert(error.message);

        return;

    }


    await supabaseClient
        .storage
        .from("study-pdfs")
        .remove([
            data.storage_path
        ]);


    await supabaseClient
        .from("materials")
        .delete()
        .eq("id",id);


    app();

}

function viewerHtml(){

    if(!pdfWindow)
        return "";


    return `

        <div class="viewer">

            <div class="viewer-box">

                <div class="viewer-head">

                    <b>
                        ${esc(pdfWindow.title)}
                    </b>

                    <button
                        class="btn gray"
                        onclick="pdfWindow=null;app()">

                        Close

                    </button>

                </div>


                <iframe
                    class="viewer-frame"
                    src="${pdfWindow.url}">
                </iframe>

            </div>

        </div>

    `;

}


/* ====================================================
   PATCH VIEWER INTO RENDER
==================================================== */

const originalRender = render;

render = function(){

    const base =
        originalRender();

    return base + viewerHtml();

};
