<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student PDF Library</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:none;
}

.hidden{
  display:none!important;
}

/* TOP BAR */
.topbar{
  background:#172554;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

/* CARDS */
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.07);
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.tile{
  background:white;
  border-radius:16px;
  padding:22px;
  border:1px solid #e6eaf0;
  cursor:pointer;
  transition:.2s;
}

.tile:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 22px rgba(0,0,0,.09);
}

.tile-icon{
  font-size:34px;
  margin-bottom:10px;
}

/* BUTTONS */
.btn{
  background:#2563eb;
  color:white;
  padding:10px 14px;
  border-radius:10px;
}

.btn:hover{
  opacity:.9;
}

.btn.gray{
  background:#e5e7eb;
  color:#111827;
}

.btn.red{
  background:#dc2626;
}

.btn.green{
  background:#059669;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:28px;
  border-radius:20px;
  margin-bottom:20px;
}

.hero h1{
  margin-bottom:8px;
}

/* FORM */
.form{
  display:grid;
  gap:12px;
}

.input{
  width:100%;
  padding:11px 12px;
  border:1px solid #d7dce6;
  border-radius:10px;
  background:white;
}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#eff6ff,#f5f3ff);
}

.login-box{
  width:min(430px,100%);
}

/* ADMIN */
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}

.tab{
  padding:10px 14px;
  border-radius:9px;
  background:#e5e7eb;
  white-space:nowrap;
}

.tab.active{
  background:#2563eb;
  color:white;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #edf0f4;
}

.item:last-child{
  border-bottom:none;
}

.small{
  font-size:13px;
}

.muted{
  color:#6b7280;
}

/* PDF */
.pdf-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.pdf-viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:100;
  padding:15px;
}

.pdf-window{
  background:white;
  width:min(1100px,100%);
  height:90vh;
  margin:auto;
  border-radius:15px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.pdf-head{
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.pdf-frame{
  width:100%;
  flex:1;
  border:none;
}

/* NOTICE */
.notice{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

@media(max-width:600px){
  .topbar{
    padding:12px;
  }

  .container{
    padding:16px 10px;
  }

  .hero{
    padding:20px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =====================================================
   DATABASE
===================================================== */

const DB_KEY = "student_pdf_library_final_v1";

const defaultDatabase = {

  users:[
    {
      id:"user1",
      name:"Student",
      email:"student@example.com",
      password:"student123",
      role:"student"
    },
    {
      id:"admin1",
      name:"Admin",
      email:"admin@example.com",
      password:"admin123",
      role:"admin"
    }
  ],

  media:[
    {
      id:"medium1",
      name:"हिंदी माध्यम"
    },
    {
      id:"medium2",
      name:"English Medium"
    }
  ],

  classes:[
    {
      id:"class1",
      name:"B.Sc. 1st Year"
    }
  ],

  semesters:[
    {
      id:"sem1",
      name:"Semester 1",
      classId:"class1"
    },
    {
      id:"sem2",
      name:"Semester 2",
      classId:"class1"
    },
    {
      id:"sem3",
      name:"Semester 3",
      classId:"class1"
    },
    {
      id:"sem4",
      name:"Semester 4",
      classId:"class1"
    },
    {
      id:"sem5",
      name:"Semester 5",
      classId:"class1"
    },
    {
      id:"sem6",
      name:"Semester 6",
      classId:"class1"
    }
  ],

  subjects:[
    {
      id:"math1",
      name:"Mathematics",
      classId:"class1",
      semesterId:"sem1",
      mediumId:null
    }
  ],

  chapters:[
    {
      id:"chapter1",
      subjectId:"math1",
      name:"अध्याय 1 — भारतीय गणितज्ञों का योगदान और जीवनी"
    },
    {
      id:"chapter2",
      subjectId:"math1",
      name:"अध्याय 2 — अनुक्रमों का अभिसरण"
    },
    {
      id:"chapter3",
      subjectId:"math1",
      name:"अध्याय 3 — वास्तविक संख्याओं की श्रेणियों का अभिसरण"
    },
    {
      id:"chapter4",
      subjectId:"math1",
      name:"अध्याय 4 — सीमा एवं सातत्य"
    }
  ],

  pdfs:[]
};

let database;

const savedDatabase = localStorage.getItem(DB_KEY);

if(savedDatabase){
  database = JSON.parse(savedDatabase);
}else{
  database = defaultDatabase;
  saveDatabase();
}


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser = null;

let currentScreen = "login";

let selected = {
  mediumId:null,
  classId:null,
  semesterId:null,
  subjectId:null,
  chapterId:null
};

let adminTab = "classes";

let currentPDF = null;


/* =====================================================
   BASIC FUNCTIONS
===================================================== */

function saveDatabase(){
  localStorage.setItem(DB_KEY,JSON.stringify(database));
}

function id(prefix){
  return prefix + Date.now() + Math.random().toString(36).substring(2,7);
}

function escapeHTML(text){
  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getClass(id){
  return database.classes.find(x=>x.id===id);
}

function getSemester(id){
  return database.semesters.find(x=>x.id===id);
}

function getSubject(id){
  return database.subjects.find(x=>x.id===id);
}

function getChapter(id){
  return database.chapters.find(x=>x.id===id);
}

function getMedium(id){
  return database.media.find(x=>x.id===id);
}


/* =====================================================
   LOGIN
===================================================== */

function login(){

  const email = document.getElementById("loginEmail").value.trim();

  const password = document.getElementById("loginPassword").value;

  const user = database.users.find(
    x => x.email === email && x.password === password
  );

  if(!user){
    alert("Email या Password गलत है।");
    return;
  }

  currentUser = user;

  if(user.role === "admin"){
    currentScreen = "admin";
  }else{
    currentScreen = "medium";
  }

  render();
}

function logout(){

  currentUser = null;

  currentScreen = "login";

  selected = {
    mediumId:null,
    classId:null,
    semesterId:null,
    subjectId:null,
    chapterId:null
  };

  render();
}


/* =====================================================
   MAIN RENDER
===================================================== */

function render(){

  if(!currentUser){

    document.getElementById("app").innerHTML = loginPage();

    return;
  }

  let output = "";

  output += topBar();

  if(currentUser.role === "admin"){

    output += adminPage();

  }else{

    output += studentPage();

  }

  if(currentPDF){

    output += pdfViewer();

  }

  document.getElementById("app").innerHTML = output;
}


/* =====================================================
   TOP BAR
===================================================== */

function topBar(){

  return `
    <div class="topbar">

      <div class="logo">
        📚 Student PDF Library
      </div>

      <div>
        <span style="margin-right:10px">
          ${escapeHTML(currentUser.name)}
        </span>

        <button
          class="btn gray"
          onclick="logout()">
          Logout
        </button>

      </div>

    </div>
  `;
}


/* =====================================================
   LOGIN PAGE
===================================================== */

function loginPage(){

  return `

    <div class="login-page">

      <div class="card login-box">

        <h1 style="margin-bottom:10px">
          📚 Student PDF Library
        </h1>

        <p class="muted" style="margin-bottom:18px">
          Student Study Material Portal
        </p>

        <div class="form">

          <input
            id="loginEmail"
            class="input"
            placeholder="Email"
            value="student@example.com">

          <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password"
            value="student123">

          <button
            class="btn"
            onclick="login()">
            Login
          </button>

        </div>

        <div class="notice small">

          <b>Student Demo Login</b><br>
          Email: student@example.com<br>
          Password: student123

          <br><br>

          <b>Admin Demo Login</b><br>
          Email: admin@example.com<br>
          Password: admin123

        </div>

      </div>

    </div>

  `;
}


/* =====================================================
   STUDENT PAGE
===================================================== */

function studentPage(){

  if(currentScreen==="medium"){

    return `
      <main class="container">

        <div class="hero">

          <h1>🌐 Medium चुनें</h1>

          <p>
            अपना अध्ययन माध्यम चुनें।
          </p>

        </div>

        <div class="grid">

          ${database.media.map(m => `

            <div class="tile"
                 onclick="selectMedium('${m.id}')">

              <div class="tile-icon">
                🌐
              </div>

              <h3>
                ${escapeHTML(m.name)}
              </h3>

              <p class="muted small">
                आगे बढ़ने के लिए क्लिक करें
              </p>

            </div>

          `).join("")}

        </div>

      </main>
    `;
  }


  if(currentScreen==="class"){

    return studentSelectionPage(
      "🎓 Class / Course चुनें",
      database.classes,
      "selectClass",
      "🎓"
    );

  }


  if(currentScreen==="semester"){

    const list = database.semesters.filter(
      x => x.classId === selected.classId
    );

    return studentSelectionPage(
      "📘 Semester चुनें",
      list,
      "selectSemester",
      "📘"
    );

  }


  if(currentScreen==="subject"){

    const list = database.subjects.filter(
      x =>
        x.classId === selected.classId &&
        x.semesterId === selected.semesterId &&
        (x.mediumId===null || x.mediumId===selected.mediumId)
    );

    return studentSelectionPage(
      "📚 Subject चुनें",
      list,
      "selectSubject",
      "📚"
    );

  }


  if(currentScreen==="chapter"){

    const list = database.chapters.filter(
      x => x.subjectId === selected.subjectId
    );

    return studentSelectionPage(
      "📖 Chapter चुनें",
      list,
      "selectChapter",
      "📖"
    );

  }


  if(currentScreen==="pdf"){

    return pdfListPage();

  }

  return "";
}


/* =====================================================
   STUDENT SELECTION PAGE
===================================================== */

function studentSelectionPage(title,list,fn,icon){

  return `

    <main class="container">

      <div style="margin-bottom:15px">
        <button
          class="btn gray"
          onclick="studentBack()">
          ← Back
        </button>
      </div>

      <div class="hero">

        <h1>
          ${title}
        </h1>

        <p>
          Study material access करने के लिए option चुनें।
        </p>

      </div>

      <div class="grid">

        ${
          list.length
          ?
          list.map(item => `

            <div class="tile"
                 onclick="${fn}('${item.id}')">

              <div class="tile-icon">
                ${icon}
              </div>

              <h3>
                ${escapeHTML(item.name)}
              </h3>

              <p class="muted small">
                Open →
              </p>

            </div>

          `).join("")
          :
          `
            <div class="card">
              <b>
                अभी कोई data उपलब्ध नहीं है।
              </b>
            </div>
          `
        }

      </div>

    </main>

  `;
}


/* =====================================================
   STUDENT NAVIGATION
===================================================== */

function selectMedium(id){

  selected.mediumId = id;

  currentScreen = "class";

  render();
}

function selectClass(id){

  selected.classId = id;

  currentScreen = "semester";

  render();
}

function selectSemester(id){

  selected.semesterId = id;

  currentScreen = "subject";

  render();
}

function selectSubject(id){

  selected.subjectId = id;

  currentScreen = "chapter";

  render();
}

function selectChapter(id){

  selected.chapterId = id;

  currentScreen = "pdf";

  render();
}

function studentBack(){

  if(currentScreen==="class"){
    currentScreen="medium";
  }
  else if(currentScreen==="semester"){
    currentScreen="class";
  }
  else if(currentScreen==="subject"){
    currentScreen="semester";
  }
  else if(currentScreen==="chapter"){
    currentScreen="subject";
  }
  else if(currentScreen==="pdf"){
    currentScreen="chapter";
  }

  render();
}


/* =====================================================
   PDF PAGE
===================================================== */

function pdfListPage(){

  const chapter = getChapter(selected.chapterId);

  const pdfs = database.pdfs.filter(
    x => x.chapterId === selected.chapterId
  );

  return `

    <main class="container">

      <div style="margin-bottom:15px">

        <button
          class="btn gray"
          onclick="studentBack()">
          ← Back
        </button>

      </div>

      <div class="hero">

        <h1>
          📄 PDF Material
        </h1>

        <p>
          ${escapeHTML(chapter ? chapter.name : "")}
        </p>

      </div>

      ${
        pdfs.length
        ?
        pdfs.map(p => `

          <div class="card pdf-item">

            <div>

              <h3>
                📄 ${escapeHTML(p.title)}
              </h3>

              <p class="muted small">
                ${escapeHTML(p.description || "Study Material")}
              </p>

            </div>

            <button
              class="btn"
              onclick="openPDF('${p.id}')">

              Read PDF

            </button>

          </div>

        `).join("")
        :
        `
          <div class="card">

            <h3>
              अभी PDF उपलब्ध नहीं है।
            </h3>

            <p class="muted">
              Admin बाद में इस Chapter में PDF upload कर सकता है।
            </p>

          </div>
        `
      }

    </main>
  `;
}


/* =====================================================
   PDF VIEWER
===================================================== */

function openPDF(id){

  currentPDF = database.pdfs.find(
    x => x.id === id
  );

  render();
}

function closePDF(){

  currentPDF = null;

  render();
}

function pdfViewer(){

  return `

    <div class="pdf-viewer">

      <div class="pdf-window">

        <div class="pdf-head">

          <strong>
            ${escapeHTML(currentPDF.title)}
          </strong>

          <button
            class="btn gray"
            onclick="closePDF()">

            Close

          </button>

        </div>

        <iframe
          class="pdf-frame"
          src="${currentPDF.data}">
        </iframe>

      </div>

    </div>

  `;
}


/* =====================================================
   ADMIN PAGE
===================================================== */

function adminPage(){

  const tabs = [

    ["classes","Classes"],
    ["media","Medium"],
    ["semesters","Semesters"],
    ["subjects","Subjects"],
    ["chapters","Chapters"],
    ["pdfs","PDF Upload"]

  ];

  let content = "";

  if(adminTab==="classes"){
    content = adminClasses();
  }

  if(adminTab==="media"){
    content = adminMedia();
  }

  if(adminTab==="semesters"){
    content = adminSemesters();
  }

  if(adminTab==="subjects"){
    content = adminSubjects();
  }

  if(adminTab==="chapters"){
    content = adminChapters();
  }

  if(adminTab==="pdfs"){
    content = adminPDFs();
  }

  return `

    <main class="container">

      <div class="hero">

        <h1>
          👨‍💻 Admin Dashboard
        </h1>

        <p>
          यहाँ से पूरा academic structure manage करें।
        </p>

      </div>

      <div class="tabs">

        ${
          tabs.map(t => `

            <button
              class="tab ${adminTab===t[0] ? "active" : ""}"
              onclick="adminTab='${t[0]}';render()">

              ${t[1]}

            </button>

          `).join("")
        }

      </div>

      ${content}

    </main>

  `;
}


/* =====================================================
   ADMIN - CLASSES
===================================================== */

function adminClasses(){

  return `

    <div class="card">

      <h2>
        Class / Course जोड़ें
      </h2>

      <br>

      <div class="form">

        <input
          id="newClass"
          class="input"
          placeholder="जैसे B.Sc. 2nd Year">

        <button
          class="btn"
          onclick="addClass()">

          + Add Class

        </button>

      </div>

    </div>

    <div class="card">

      <h2>
        Classes
      </h2>

      <br>

      ${database.classes.map(c => `

        <div class="item">

          <div>
            <b>${escapeHTML(c.name)}</b>
          </div>

          <div class="row">

            <button
              class="btn gray"
              onclick="editClass('${c.id}')">

              Edit

            </button>

            <button
              class="btn red"
              onclick="deleteClass('${c.id}')">

              Delete

            </button>

          </div>

        </div>

      `).join("")}

    </div>

  `;
}

function addClass(){

  const name = document.getElementById("newClass").value.trim();

  if(!name){
    alert("Class का नाम लिखें।");
    return;
  }

  database.classes.push({
    id:id("class"),
    name:name
  });

  saveDatabase();

  render();
}

function editClass(idValue){

  const item = getClass(idValue);

  const name = prompt(
    "Class का नया नाम:",
    item.name
  );

  if(name && name.trim()){

    item.name = name.trim();

    saveDatabase();

    render();
  }
}

function deleteClass(idValue){

  if(!confirm("क्या इस Class को delete करना है?")){
    return;
  }

  const semesterIds = database.semesters
    .filter(x=>x.classId===idValue)
    .map(x=>x.id);

  const subjectIds = database.subjects
    .filter(x=>semesterIds.includes(x.semesterId))
    .map(x=>x.id);

  const chapterIds = database.chapters
    .filter(x=>subjectIds.includes(x.subjectId))
    .map(x=>x.id);

  database.pdfs =
    database.pdfs.filter(
      x=>!chapterIds.includes(x.chapterId)
    );

  database.chapters =
    database.chapters.filter(
      x=>!subjectIds.includes(x.subjectId)
    );

  database.subjects =
    database.subjects.filter(
      x=>!semesterIds.includes(x.semesterId)
    );

  database.semesters =
    database.semesters.filter(
      x=>x.classId!==idValue
    );

  database.classes =
    database.classes.filter(
      x=>x.id!==idValue
    );

  saveDatabase();

  render();
}


/* =====================================================
   ADMIN - MEDIUM
===================================================== */

function adminMedia(){

  return `

    <div class="card">

      <h2>
        Medium जोड़ें
      </h2>

      <br>

      <div class="form">

        <input
          id="newMedium"
          class="input"
          placeholder="जैसे Hindi Medium">

        <button
          class="btn"
          onclick="addMedium()">

          + Add Medium

        </button>

      </div>

    </div>

    <div class="card">

      <h2>
        Medium List
      </h2>

      <br>

      ${database.media.map(m => `

        <div class="item">

          <b>
            ${escapeHTML(m.name)}
          </b>

          <div class="row">

            <button
              class="btn gray"
              onclick="editMedium('${m.id}')">

              Edit

            </button>

            <button
              class="btn red"
              onclick="deleteMedium('${m.id}')">

              Delete

            </button>

          </div>

        </div>

      `).join("")}

    </div>

  `;
}

function addMedium(){

  const name =
    document.getElementById("newMedium").value.trim();

  if(!name){
    alert("Medium का नाम लिखें।");
    return;
  }

  database.media.push({
    id:id("medium"),
    name:name
  });

  saveDatabase();

  render();
}

function editMedium(idValue){

  const item = getMedium(idValue);

  const name = prompt(
    "Medium का नया नाम:",
    item.name
  );

  if(name && name.trim()){

    item.name = name.trim();

    saveDatabase();

    render();
  }
}

function deleteMedium(idValue){

  if(!confirm("Medium delete करें?")){
    return;
  }

  database.media =
    database.media.filter(x=>x.id!==idValue);

  database.subjects.forEach(s=>{
    if(s.mediumId===idValue){
      s.mediumId=null;
    }
  });

  saveDatabase();

  render();
}

function addSemester(){

  const name =
    document.getElementById("newSemester").value.trim();

  const classId =
    document.getElementById("semesterClass").value;

  if(!name){
    alert("Semester का नाम लिखें।");
    return;
  }

  database.semesters.push({

    id:id("semester"),

    name:name,

    classId:classId

  });

  saveDatabase();

  render();
}

function editSemester(idValue){

  const item = getSemester(idValue);

  const name = prompt(
    "Semester का नया नाम:",
    item.name
  );

  if(name && name.trim()){

    item.name=name.trim();

    saveDatabase();

    render();
  }
}

function deleteSemester(idValue){

  if(!confirm("Semester और उसका data delete करें?")){
    return;
  }

  const subjectIds =
    database.subjects
      .filter(x=>x.semesterId===idValue)
      .map(x=>x.id);

  const chapterIds =
    database.chapters
      .filter(x=>subjectIds.includes(x.subjectId))
      .map(x=>x.id);

  database.pdfs =
    database.pdfs.filter(
      x=>!chapterIds.includes(x.chapterId)
    );

  database.chapters =
    database.chapters.filter(
      x=>!subjectIds.includes(x.subjectId)
    );

  database.subjects =
    database.subjects.filter(
      x=>x.semesterId!==idValue
    );

  database.semesters =
    database.semesters.filter(
      x=>x.id!==idValue
    );

  saveDatabase();

  render();
}

/* =====================================================
   ADMIN - PDF
===================================================== */

function adminPDFs(){

  return `

    <div class="card">

      <h2>
        📄 Manual PDF Upload
      </h2>

      <p class="muted">
        PDF सीधे Chapter के अंदर upload होगी।
      </p>

      <br>

      <div class="form">

        <select
          id="pdfClass"
          class="input"
          onchange="updatePDFSelectors()">

          ${database.classes.map(c=>`

            <option value="${c.id}">
              ${escapeHTML(c.name)}
            </option>

          `).join("")}

        </select>

        <select
          id="pdfSemester"
          class="input"
          onchange="updatePDFSelectors()">
        </select>

        <select
          id="pdfSubject"
          class="input"
          onchange="updatePDFSelectors()">
        </select>

        <select
          id="pdfChapter"
          class="input">
        </select>

        <input
          id="pdfTitle"
          class="input"
          placeholder="PDF title">

        <input
          id="pdfDescription"
          class="input"
          placeholder="Description">

        <input
          id="pdfFile"
          type="file"
          accept="application/pdf"
          class="input">

        <button
          class="btn green"
          onclick="uploadPDF()">

          ⬆ Upload PDF

        </button>

      </div>

      <div class="notice small">

        PDF upload होने के बाद student उसे
        Medium → Class → Semester → Subject →
        Chapter में देख सकेगा।

      </div>

    </div>

    <div class="card">

      <h2>
        Uploaded PDFs
      </h2>

      <br>

      ${
        database.pdfs.length
        ?
        database.pdfs.map(p=>`

          <div class="item">

            <div>

              <b>
                📄 ${escapeHTML(p.title)}
              </b>

              <div class="small muted">

                ${
                  escapeHTML(
                    getChapter(p.chapterId)?.name || ""
                  )
                }

              </div>

            </div>

            <div class="row">

              <button
                class="btn gray"
                onclick="editPDF('${p.id}')">

                Edit

              </button>

              <button
                class="btn red"
                onclick="deletePDF('${p.id}')">

                Delete

              </button>

            </div>

          </div>

        `).join("")
        :
        `
          <p class="muted">
            अभी कोई PDF upload नहीं हुई है।
          </p>
        `
      }

    </div>

    <script>
      setTimeout(updatePDFSelectors,50);
    <\/script>

  `;
}

function updatePDFSelectors(){

  const classSelect =
    document.getElementById("pdfClass");

  const semesterSelect =
    document.getElementById("pdfSemester");

  const subjectSelect =
    document.getElementById("pdfSubject");

  const chapterSelect =
    document.getElementById("pdfChapter");

  if(
    !classSelect ||
    !semesterSelect ||
    !subjectSelect ||
    !chapterSelect
  ){
    return;
  }

  const classId =
    classSelect.value;

  const semesters =
    database.semesters.filter(
      x=>x.classId===classId
    );

  semesterSelect.innerHTML =
    semesters.map(s=>`

      <option value="${s.id}">
        ${escapeHTML(s.name)}
      </option>

    `).join("");

  const semesterId =
    semesterSelect.value;

  const subjects =
    database.subjects.filter(
      x =>
        x.classId===classId &&
        x.semesterId===semesterId
    );

  subjectSelect.innerHTML =
    subjects.map(s=>`

      <option value="${s.id}">
        ${escapeHTML(s.name)}
      </option>

    `).join("");

  const subjectId =
    subjectSelect.value;

  const chapters =
    database.chapters.filter(
      x=>x.subjectId===subjectId
    );

  chapterSelect.innerHTML =
    chapters.map(c=>`

      <option value="${c.id}">
        ${escapeHTML(c.name)}
      </option>

    `).join("");
}

function uploadPDF(){

  const fileInput =
    document.getElementById("pdfFile");

  const file =
    fileInput.files[0];

  if(!file){
    alert("PDF file चुनें।");
    return;
  }

  if(file.type!=="application/pdf"){
    alert("सिर्फ PDF file upload करें।");
    return;
  }

  const title =
    document.getElementById("pdfTitle").value.trim()
    || file.name;

  const description =
    document.getElementById("pdfDescription").value.trim();

  const chapterId =
    document.getElementById("pdfChapter").value;

  if(!chapterId){
    alert("पहले Chapter चुनें।");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){

    database.pdfs.push({

      id:id("pdf"),

      title:title,

      description:description,

      chapterId:chapterId,

      data:reader.result

    });

    saveDatabase();

    alert("PDF successfully upload हो गई।");

    render();
  };

  reader.readAsDataURL(file);
}

function editPDF(idValue){

  const item =
    database.pdfs.find(
      x=>x.id===idValue
    );

  const title =
    prompt(
      "PDF का नया नाम:",
      item.title
    );

  if(title && title.trim()){

    item.title=title.trim();

    saveDatabase();

    render();
  }
}

function deletePDF(idValue){

  if(!confirm("क्या PDF delete करनी है?")){
    return;
  }

  database.pdfs =
    database.pdfs.filter(
      x=>x.id!==idValue
    );

  saveDatabase();

  render();
}


/* =====================================================
   START
===================================================== */

render();

</script>
